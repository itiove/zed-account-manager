[package]
name = "zed-account-manager"
version = "0.1.0"
description = "管理多个 Zed 账号并一键无重启切换"
edition = "2021"
publish = false

[lib]
name = "zed_account_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4"
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"
url = "2"
serde_urlencoded = "0.7"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
dirs = "5"
