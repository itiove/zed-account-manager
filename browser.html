<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内置浏览器工具栏</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #toolbar {
        width: 100%;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        box-sizing: border-box;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
      }
      .btn-group {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .nav-btn {
        width: 32px;
        height: 32px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #ffffff;
        color: #475569;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      }
      .nav-btn:hover:not(:disabled) {
        background: #f1f5f9;
        color: #0f172a;
        border-color: #cbd5e1;
      }
      .nav-btn:active:not(:disabled) {
        transform: scale(0.95);
      }
      .nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
      }
      #url-form {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        height: 36px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 0 10px;
        gap: 8px;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #url-form:focus-within {
        border-color: #0f172a;
        box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.08);
        background: #ffffff;
      }
      .security-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        color: #64748b;
        flex-shrink: 0;
      }
      #url-form.secure .security-badge {
        color: #16a34a;
      }
      #url-input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        color: #0f172a;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        user-select: text;
        -webkit-user-select: text;
      }
      .action-btns {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .action-btn {
        height: 34px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      }
      .action-btn.primary {
        background: #0f172a;
        color: #ffffff;
        border: 1px solid #0f172a;
      }
      .action-btn.primary:hover {
        background: #1e293b;
        border-color: #1e293b;
      }
      .action-btn.primary:active {
        transform: scale(0.97);
      }
      .action-btn.secondary {
        background: #ffffff;
        color: #0f172a;
        border: 1px solid #e2e8f0;
      }
      .action-btn.secondary:hover {
        background: #f1f5f9;
        border-color: #cbd5e1;
      }
      .action-btn.secondary:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="btn-group">
        <button class="nav-btn" id="btn-back" title="后退 (Cmd+[)" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="前进 (Cmd+])" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <button class="nav-btn" id="btn-reload" title="刷新页面 (Cmd+R)" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>

      <form id="url-form" autocomplete="off">
        <span class="security-badge" id="security-badge" title="安全连接状态">
          <svg id="lock-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input
          id="url-input"
          type="text"
          spellcheck="false"
          placeholder="输入网址，回车访问"
        />
      </form>

      <div class="action-btns">
        <button class="action-btn primary" id="go-btn" type="button" title="访问该网址">
          前往
        </button>
        <button class="action-btn secondary" id="btn-home" type="button" title="直接跳转到 Zed Dashboard 首页">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Dashboard
        </button>
      </div>
    </div>
    <script type="module" src="/src/browser-shell.ts"></script>
  </body>
</html>
